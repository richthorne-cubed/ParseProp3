<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>ParseProp Preview</title>
  <style>
    :root {
      color-scheme: light;
      --bg: #f4f6f8;
      --panel: #ffffff;
      --line: #d8dee6;
      --text: #18202a;
      --muted: #627084;
      --control: #eef2f6;
      --control-line: #b8c2cf;
      --accent: #0969da;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      background: var(--bg);
      color: var(--text);
      font-family: Arial, Helvetica, sans-serif;
      font-size: 14px;
      line-height: 1.4;
    }

    header {
      position: sticky;
      top: 0;
      z-index: 2;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
      min-height: 56px;
      padding: 10px 18px;
      border-bottom: 1px solid var(--line);
      background: var(--panel);
    }

    h1 {
      margin: 0;
      font-size: 18px;
      font-weight: 700;
      letter-spacing: 0;
    }

    .summary {
      color: var(--muted);
      white-space: nowrap;
    }

    .top-actions {
      display: flex;
      align-items: center;
      gap: 10px;
      min-width: 0;
    }

    .xero-status {
      color: var(--muted);
      font-size: 13px;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .xero-button {
      min-height: 34px;
      padding: 6px 12px;
      border: 1px solid var(--control-line);
      border-radius: 4px;
      background: var(--control);
      color: var(--text);
      cursor: pointer;
      font: inherit;
      white-space: nowrap;
    }

    .xero-button:hover {
      background: #ffffff;
    }

    .debug-link {
      color: var(--muted);
      font-size: 13px;
      text-decoration: none;
    }

    .debug-link:hover {
      color: var(--accent);
      text-decoration: underline;
    }

    main {
      display: flex;
      flex-direction: column;
      gap: 18px;
      padding: 18px;
    }

    .document {
      display: grid;
      grid-template-columns: minmax(360px, 48%) minmax(520px, 1fr);
      gap: 18px;
      align-items: start;
      min-height: calc(100vh - 92px);
    }

    .preview,
    .transactions {
      min-width: 0;
      border: 1px solid var(--line);
      background: var(--panel);
    }

    .preview {
      position: sticky;
      top: 74px;
      height: calc(100vh - 92px);
    }

    .pdf-frame {
      display: block;
      width: 100%;
      height: 100%;
      border: 0;
      background: #ffffff;
    }

    .transactions {
      overflow: hidden;
    }

    .doc-meta {
      display: grid;
      grid-template-columns: 1fr auto;
      gap: 8px 18px;
      padding: 12px 14px;
      border-bottom: 1px solid var(--line);
      background: #fbfcfd;
    }

    .file-name {
      font-weight: 700;
    }

    .meta-line {
      color: var(--muted);
      font-size: 13px;
    }

    .total {
      align-self: center;
      font-variant-numeric: tabular-nums;
      font-weight: 700;
      text-align: right;
    }

    table {
      width: 100%;
      border-collapse: collapse;
      table-layout: fixed;
    }

    th,
    td {
      padding: 8px 10px;
      border-bottom: 1px solid var(--line);
      vertical-align: top;
    }

    th {
      background: #f7f9fb;
      color: var(--muted);
      font-size: 12px;
      font-weight: 700;
      text-align: left;
      text-transform: uppercase;
    }

    th:nth-child(2),
    td:nth-child(2) {
      width: 150px;
    }

    th:nth-child(3),
    td:nth-child(3) {
      width: 96px;
      text-align: right;
    }

    td.description {
      overflow-wrap: anywhere;
    }

    td.amount {
      font-variant-numeric: tabular-nums;
      white-space: nowrap;
    }

    select {
      width: 100%;
      min-height: 32px;
      padding: 4px 28px 4px 8px;
      border: 1px solid var(--control-line);
      border-radius: 4px;
      background: var(--control);
      color: var(--text);
      font: inherit;
    }

    select:focus {
      outline: 2px solid var(--accent);
      outline-offset: 1px;
      background: #ffffff;
    }

    .empty {
      padding: 24px;
      border: 1px solid var(--line);
      background: var(--panel);
      color: var(--muted);
    }

    @media (max-width: 980px) {
      header {
        align-items: flex-start;
        flex-direction: column;
      }

      .summary {
        white-space: normal;
      }

      .document {
        grid-template-columns: 1fr;
        min-height: 0;
      }

      .preview {
        position: static;
        height: 70vh;
      }
    }
  </style>
</head>
<body>
  <header>
    <h1>ParseProp Preview</h1>
    <div class="top-actions">
      <div class="summary" id="summary"></div>
      <div class="xero-status" id="xero-status"></div>
      <button class="xero-button" id="xero-connect" type="button">Connect Xero</button>
      <a class="debug-link" href="/xero/inspect-auth" target="_blank" rel="noopener">Inspect auth URL</a>
      <a class="debug-link" href="/xero/debug" target="_blank" rel="noopener">OAuth debug</a>
    </div>
  </header>
  <main id="documents">
    <div class="empty">Loading...</div>
  </main>

  <script>
    function text(value) {
      return value == null ? "" : String(value);
    }

    function makeCell(tag, className, content) {
      const cell = document.createElement(tag);
      if (className) {
        cell.className = className;
      }
      if (content != null) {
        cell.textContent = content;
      }
      return cell;
    }

    function makeTypeSelect(types, selectedType) {
      const select = document.createElement("select");

      types.forEach((type) => {
        const option = document.createElement("option");
        option.value = type;
        option.textContent = type;
        option.selected = type === selectedType;
        select.appendChild(option);
      });

      if (!types.includes(selectedType)) {
        const option = document.createElement("option");
        option.value = selectedType;
        option.textContent = selectedType;
        option.selected = true;
        select.appendChild(option);
      }

      return select;
    }

    function renderDocument(documentData, index) {
      const section = document.createElement("section");
      section.className = "document";

      const preview = document.createElement("div");
      preview.className = "preview";
      const frame = document.createElement("iframe");
      frame.className = "pdf-frame";
      frame.src = `/pdf/${index}`;
      frame.title = `${documentData.fileName} preview`;
      preview.appendChild(frame);

      const transactions = document.createElement("div");
      transactions.className = "transactions";

      const meta = document.createElement("div");
      meta.className = "doc-meta";

      const titleBlock = document.createElement("div");
      const fileName = document.createElement("div");
      fileName.className = "file-name";
      fileName.textContent = documentData.fileName;
      const profile = document.createElement("div");
      profile.className = "meta-line";
      profile.textContent = documentData.profileName;
      const property = document.createElement("div");
      property.className = "meta-line";
      property.textContent = text(documentData.property && documentData.property.address);
      titleBlock.append(fileName, profile, property);

      const total = document.createElement("div");
      total.className = "total";
      total.textContent = documentData.total;
      meta.append(titleBlock, total);

      const table = document.createElement("table");
      const thead = document.createElement("thead");
      const headerRow = document.createElement("tr");
      headerRow.append(
        makeCell("th", "", "Description"),
        makeCell("th", "", "Type"),
        makeCell("th", "", "Amount")
      );
      thead.appendChild(headerRow);

      const tbody = document.createElement("tbody");
      documentData.lines.forEach((line) => {
        const row = document.createElement("tr");
        const typeCell = makeCell("td", "");
        typeCell.appendChild(makeTypeSelect(documentData.accountTypes, line.type));
        row.append(
          makeCell("td", "description", line.description),
          typeCell,
          makeCell("td", "amount", line.amount)
        );
        tbody.appendChild(row);
      });

      table.append(thead, tbody);
      transactions.append(meta, table);
      section.append(preview, transactions);
      return section;
    }

    async function loadPreview() {
      const response = await fetch("/data.json");
      if (!response.ok) {
        throw new Error(`Failed to load preview data: ${response.status}`);
      }
      const data = await response.json();
      const root = document.getElementById("documents");
      root.replaceChildren();

      document.getElementById("summary").textContent =
        `${data.documents.length} document${data.documents.length === 1 ? "" : "s"}`;

      data.documents.forEach((documentData, index) => {
        root.appendChild(renderDocument(documentData, index));
      });
    }

    async function loadXeroStatus() {
      const statusEl = document.getElementById("xero-status");
      const button = document.getElementById("xero-connect");

      try {
        const response = await fetch("/xero/status");
        const status = await response.json();

        if (!status.configured) {
          statusEl.textContent = "Xero config missing";
          button.disabled = true;
          return;
        }

        if (status.connected) {
          statusEl.textContent = `Xero: ${status.tenantName || "connected"}`;
          button.textContent = "Reconnect Xero";
          return;
        }

        if (status.identityConnected) {
          statusEl.textContent = "Xero: identity connected, no organisation";
          button.textContent = "Reconnect Xero";
          return;
        }

        statusEl.textContent = "Xero: not connected";
        button.textContent = "Connect Xero";
      } catch (error) {
        statusEl.textContent = "Xero status unavailable";
        button.disabled = true;
      }
    }

    document.getElementById("xero-connect").addEventListener("click", () => {
      window.open("/xero/connect", "_blank", "noopener");
    });

    loadPreview().catch((error) => {
      document.getElementById("documents").innerHTML =
        `<div class="empty">${error.message}</div>`;
    });
    loadXeroStatus();
    setInterval(loadXeroStatus, 5000);
  </script>
</body>
</html>
